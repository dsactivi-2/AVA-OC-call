; =========================================================================
; ari.conf — Asterisk REST Interface Konfiguration
; Fuer AVA AI Voice Agent
; =========================================================================

[general]
enabled = yes
pretty = yes
allowed_origins = http://127.0.0.1:8080,http://localhost:8080
auth_realm = Asterisk REST Interface

; -------------------------------------------------------------------------
; User fuer AVA AI Voice Agent
; -------------------------------------------------------------------------
[ava-bot]
type = user
read_only = no
password = ava-secret-2024
password_format = plain

; -------------------------------------------------------------------------
; User fuer Health-Check-Script (read-only)
; -------------------------------------------------------------------------
[ava-monitor]
type = user
read_only = yes
password = monitor-readonly-2024
password_format = plain
