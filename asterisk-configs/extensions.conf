; =========================================================================
; extensions.conf — AVA AI Callcenter Contexts
; Ergaenzt die bestehende extensions.conf (nicht ersetzen)
; =========================================================================

; -------------------------------------------------------------------------
; Context: ava-outbound
; Wird aufgerufen wenn ein outbound Call via AMI Originate initiiert wird.
; AMD-Analyse laeuft automatisch durch, dann AVA via AudioSocket.
; -------------------------------------------------------------------------
[ava-outbound]

; Schritt 1: Anruf annehmen und kurz warten
exten => s,1,NoOp(AVA Outbound Call gestartet: ${CALLERID(num)} -> ${OUTBOUND_NUMBER})
 same => n,Answer()
 same => n,Wait(1)

; Schritt 2: AMD starten — Parameter werden aus /etc/asterisk/amd.conf geladen
; AMDSTATUS: MACHINE, HUMAN, NOTSURE, HANGUP
; AMDCAUSE:  NOTSURE, LONGGREETING, INITIALSILENCE, HUMAN, MACHINE, AFTERBEEP
; WICHTIG: AMD() ohne Parameter nutzt amd.conf-Defaults (betweenWordSilence=50, maximumNumberOfWords=3).
; Explizite Parameter AMD(800,2500,1500,5000,100,8,256) waren FALSCH — betweenWordSilence=8ms und
; maximumNumberOfWords=256 verhindern jede HUMAN-Erkennung. Konfiguration erfolgt via amd.conf.
same => n,AMD()
same => n,NoOp(AMD Result: ${AMDSTATUS} / ${AMDCAUSE})

; Schritt 3: Routing je nach AMD-Ergebnis
same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?voicemail,1)
same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human,1)
same => n,GotoIf($["${AMDSTATUS}" = "HANGUP"]?hangup,1)
; NOTSURE: ebenfalls aufhaengen und spaeter erneut versuchen
same => n,Hangup()

; HUMAN erkannt: Call an AVA via AudioSocket uebergeben
exten => human,1,NoOp(AMD: HUMAN erkannt - uebergabe an AVA)
 same => n,Set(CAMPAIGN_ID=${CAMPAIGN_ID})
 same => n,Set(LEAD_ID=${LEAD_ID})
 same => n,Set(LEAD_NAME=${LEAD_NAME})
 same => n,Set(LEAD_LANGUAGE=${LEAD_LANGUAGE})
 same => n,Set(CALL_DIRECTION=outbound)
 same => n,Set(CALL_START_TIME=${STRFTIME(${EPOCH},,%Y-%m-%dT%H:%M:%S)})
 same => n,MixMonitor(/var/log/asterisk/recordings/${CAMPAIGN_ID}-${LEAD_ID}-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.wav,b)
 ; WICHTIG: AudioSocket erwartet UUID als erstes Argument, Service-Adresse als zweites.
 ; ${UNIQUEID} ist kein gueltiges UUID-Format — daher wird via uuidgen eine echte UUID generiert.
 ; AVA identifiziert die Session anhand dieser UUID (nicht der Asterisk-internen Channel-ID).
 same => n,Set(AUDIO_UUID=${SHELL(uuidgen)})
 same => n,AudioSocket(${AUDIO_UUID},127.0.0.1:9092)
 same => n,NoOp(AVA AudioSocket Session beendet)
 same => n,Hangup()

; MACHINE erkannt: Voicemail-Nachricht abspielen
exten => voicemail,1,NoOp(AMD: MACHINE erkannt - warte auf BEEP)
 same => n,Wait(2)
 same => n,Playback(/var/lib/asterisk/sounds/ava/voicemail-${LEAD_LANGUAGE})
 same => n,Wait(1)
 same => n,Hangup()

; HANGUP: Lead hat waehrend AMD aufgelegt
exten => hangup,1,NoOp(AMD: HANGUP waehrend Analyse)
 same => n,Hangup()


; -------------------------------------------------------------------------
; Context: ava-inbound
; Eingehende Calls werden sofort an AVA weitergegeben.
; -------------------------------------------------------------------------
[ava-inbound]

exten => _X.,1,NoOp(AVA Inbound Call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(CALL_DIRECTION=inbound)
 same => n,Set(CALL_START_TIME=${STRFTIME(${EPOCH},,%Y-%m-%dT%H:%M:%S)})
 same => n,Set(INBOUND_CALLERID=${CALLERID(num)})
 same => n,MixMonitor(/var/log/asterisk/recordings/inbound-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.wav,b)
 ; WICHTIG: AudioSocket erwartet UUID als erstes Argument, Service-Adresse als zweites.
 ; ${UNIQUEID} ist kein gueltiges UUID-Format — daher wird via uuidgen eine echte UUID generiert.
 same => n,Set(AUDIO_UUID=${SHELL(uuidgen)})
 same => n,AudioSocket(${AUDIO_UUID},127.0.0.1:9092)
 same => n,NoOp(AVA Inbound Session beendet)
 same => n,Hangup()

; Fallback wenn AudioSocket nicht erreichbar
exten => _X.,101,NoOp(AudioSocket nicht erreichbar - Fallback)
 same => n,Playback(tt-allbusy)
 same => n,Hangup()


; -------------------------------------------------------------------------
; Context: ava-handoff
; Wird aufgerufen wenn Ava einen Human Handoff einleitet.
; AVA sendet ARI-Command: Channel auf diesen Context routen.
; -------------------------------------------------------------------------
[ava-handoff]

exten => s,1,NoOp(Human Handoff initiiert fuer: ${CALLERID(num)})
 same => n,Set(AGENT_EXTENSION=SIP/200)
 same => n,Bridge(${HANDOFF_CHANNEL},p)
 same => n,Hangup()

; Direkter Transfer zu Agent-Durchwahl
exten => _2XX,1,NoOp(Transfer zu Agent: ${EXTEN})
 same => n,Dial(SIP/${EXTEN},30,tT)
 same => n,Hangup()
