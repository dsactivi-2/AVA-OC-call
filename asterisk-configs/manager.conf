; =========================================================================
; manager.conf — Asterisk Manager Interface Konfiguration
; AMI wird fuer Outbound-Originate (Kampagnen-Script) benutzt
; WICHTIG: Diese Sektion ans Ende der bestehenden manager.conf ergaenzen
; =========================================================================

; Generelle AMI-Einstellungen (nur ergaenzen wenn noch nicht vorhanden):
; [general]
; enabled = yes
; port = 5038
; bindaddr = 127.0.0.1

; -------------------------------------------------------------------------
; AMI-User fuer Kampagnen-Scripts (Originate + Monitor)
; -------------------------------------------------------------------------
[ava-campaign]
secret = campaign-secret-2024
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,log,verbose,command,agent,originate
write = system,call,log,verbose,command,agent,originate

; -------------------------------------------------------------------------
; AMI-User fuer Health-Check (nur lesen)
; -------------------------------------------------------------------------
[ava-health]
secret = health-readonly-2024
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,log,verbose
write = command
