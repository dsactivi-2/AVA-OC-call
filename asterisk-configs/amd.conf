; =========================================================================
; amd.conf — Answering Machine Detection Konfiguration
; Optimiert fuer deutsche Mobilfunk- und Festnetz-Anrufbeantworter
; =========================================================================

[general]

; Maximale Zeit (ms) fuer initiale Stille bevor erste Stimme
; Deutsche Vodafone/T-Mobile Mailboxen: ~500-800ms Stille
initial_silence = 2500

; Maximale Laenge (ms) einer Begruessung die noch als HUMAN gilt
; Menschen: meist < 1500ms (Hallo? / Ja?)
; Anrufbeantworter: > 2000ms (langer Firmennamen-Ansage)
greeting = 1500

; Stille nach Begruessung die auf Anrufbeantworter hinweist (ms)
after_greeting_silence = 800

; Gesamte AMD-Analysezeit (ms) - danach Timeout und NOTSURE
total_analysis_time = 5000

; Minimale Wortlaenge (ms) - Geraeusche kuerzer als dies werden ignoriert
min_word_length = 100

; Zwischen-Wort-Stille (ms) - laengere Pause = Wortende
between_words_silence = 50

; Maximale Anzahl Woerter in Begruessung fuer HUMAN-Erkennung
maximum_number_of_words = 3

; Stille am Ende die auf MACHINE (nach Beep) hinweist (ms)
silence_threshold = 256

; Maximale Laenge eines einzelnen Wortes (ms)
; Lange Woerter = wahrscheinlich TTS-Ansage eines Anrufbeantworters
maximum_word_length = 5000
